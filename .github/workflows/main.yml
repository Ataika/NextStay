name: NexStay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Linter
        run: pip install flake8
      - name: Lint Backend
        run: flake8 backend --count --exit-zero --max-line-length=127 --statistics

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install & Lint
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install --package-lock-only || npm install
            npm run lint --if-present || echo "No lint script"
          fi

  analytics-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dbt
        run: pip install dbt-postgres
      - name: Validate dbt Models
        run: |
          if [ -d "analytics/dbt" ]; then
            cd analytics/dbt
            dbt parse || echo "dbt parsing issues"
          fi

  # 4. Инфраструктура
  infra-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Docker Compose
        run: docker compose config













