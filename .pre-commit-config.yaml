# Global exclude: ignore legacy or large files that don't need linting
exclude: '^(backend/init_db_v1\.sql|init\.sql|scripts/db_backup\.sql|analytics/dbt/models/example/.*|analytics/dbt/models/test_ci\.sql|analytics/dbt/models/core/dim_dates\.sql|analytics/dbt/snapshots/.*|analytics/dbt/models/staging/.*|backend/migrations/.*\.sql|scripts/init-db\.sql|scripts/seed/seed\.sql)'

repos:
  # Standard hooks for general file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace    # Remove extra spaces at the end of lines
      - id: end-of-file-fixer      # Ensure files end with a newline
      - id: check-yaml             # Validate YAML syntax
      - id: check-added-large-files # Prevent accidental upload of huge files
      - id: detect-private-key     # Scan for accidentally included API keys/secrets
      - id: check-toml             # Validate TOML syntax (for pyproject.toml)

  # Ruff: The fast all-in-one Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        # --fix: automatically fix standard errors
        # --unsafe-fixes: allow ruff to delete unused variables/imports
        # --exit-non-zero-on-fix: fail the check if any auto-fixes were made
        args: [ --fix, --unsafe-fixes, --exit-non-zero-on-fix ]
      - id: ruff-format            # Auto-format code style (replaces Black)

  # SQLFluff: Linter for SQL and dbt models
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.4
    hooks:
      - id: sqlfluff-lint          # Check SQL code for best practices
        args: [--dialect, postgres]
        additional_dependencies: ['sqlfluff-templater-dbt']
