services: 
  db:
    image: postgres:15-alpine
    container_name: nextstay_db_clean 
    restart: always
    environment:    
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME} 
    ports:
      - "5433:5432"  
    volumes:
      - nextstay_data_v2:/var/lib/postgresql/data 
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: nextstay_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  superset:
    image: apache/superset:latest
    container_name: nextstay_superset
    restart: always
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  dbt:
    build:
      context: ./analytics
    container_name: nextstay_dbt
    volumes:
      - ./analytics:/usr/app
      - ~/.dbt:/root/.dbt
    environment:
      - DBT_PROFILES_DIR=/usr/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  nextstay_data_v2:
    external: false
