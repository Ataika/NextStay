services:
  db:
    image: postgres:15-alpine
    container_name: nextstay_db_clean
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - nextstay_data_v2:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend # Docker will look in the backend folder and find the Dockerfile there
    container_name: nextstay_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: nextstay_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_SUPERSET_URL: ${VITE_SUPERSET_URL:-http://localhost:8088}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

  airflow:
    image: apache/airflow:2.7.1-python3.10
    container_name: nextstay_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DBT_PROFILES_DIR=/opt/airflow/dbt
    volumes:
      - ./analytics/dags:/opt/airflow/dags
      - ./analytics/dbt:/opt/airflow/dbt
      - ./analytics/profiles.yml:/opt/airflow/dbt/profiles.yml # Pass the profile from analytics
      - ./scripts:/opt/airflow/scripts
    ports:
      - "8080:8080"
    command: standalone
    depends_on:
      db:
        condition: service_healthy

  superset:
    image: apache/superset:latest
    container_name: nextstay_superset
    restart: always
    ports:
      - "8088:8088"
    volumes:
      - ./analytics/superset:/app/superset_home
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py
    depends_on:
      db:
        condition: service_healthy
  dbt:
    build:
      context: ./analytics
      dockerfile: Dockerfile.dbt
    container_name: nextstay_dbt
    tty: true
    stdin_open: true
    # We remove the dbt mention from the command so that the clean Bash/Sleep is run
    entrypoint: /bin/bash
    command: -c "sleep infinity"
    volumes:
      - ./analytics/dbt:/usr/app
      - ./analytics/profiles.yml:/root/.dbt/profiles.yml
    environment:
      - DBT_PROFILES_DIR=/usr/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  nextstay_data_v2:
    external: false
  frontend_node_modules:
    external: false
